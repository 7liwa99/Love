<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <title>E-Card Project</title>
</head>
<body>
    <div id="envelope-container">
        <img src="envelope.png" alt="Envelope" id="envelope" />
        <p>♡ Letter for your ♡</p>
    </div>

    <div id="letter-container">
        <div class="letter-window">
            <h1 id="letter-title"> ♡  Will you be my love of life ? ♡ </h1>

            <img src="cat_heart.gif" class="cat" id="letter-cat" />

            <div class="buttons" id="letter-buttons">
                <img src="yes.png" class="btn yes-btn" alt="Yes ♡" />
                <img src="no.png" class="btn no-btn" alt="No" />
            </div>
        </div>

        <p id="final-text" class="final-text" style="display: none">
            <strong>Thank you so much for ALWAYS loving me.<br>Thank you so much for being with me <br>ALWAYS<br></strong> 
        </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
